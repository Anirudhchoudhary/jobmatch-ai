[project]
name = "jobmatch-backend"
version = "0.1.0"
description = "JobMatch AI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary]>=3.2",
    "pgvector",
    "alembic",
    "boto3",
    "structlog",
    "pypdf>=7.2.0",
    "langgraph>=1.2.24",
    "langchain-core>=1.8.5",
    "langchain-anthropic>=1.7.13",
    "presidio-analyzer>=2.2.366",
    "spacy>=3.8.18",
    "en-core-web-sm",
    "langfuse>=5.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "boto3-stubs[bedrock-agent-runtime,bedrock-runtime,secretsmanager]",
    "python-dotenv",
    "pre-commit",
    "fpdf2>=2.9.0",
    "cryptography>=50.0.2",
    "httpx2>=2.16.2",
    "pyyaml>=6.0.4",
    "types-pyyaml>=6.0.12.20261122",
]
evals = [
    "deepeval>=4.3.6,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["app", "evals"]
plugins = ["pydantic.mypy"]

# deepeval lives in the optional `evals` group and is untyped: absent in the default env,
# Any-typed when present. Scoped so the rest of the strict config is untouched.
[[tool.mypy.overrides]]
module = ["deepeval", "deepeval.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs docker compose postgres"]
addopts = "-m 'not integration'"
pythonpath = ["."]
