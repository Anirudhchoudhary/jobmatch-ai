[project]
name = "jobmatch-backend"
version = "0.1.0"
description = "JobMatch AI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2",
    "psycopg[binary]>=3.2",
    "pgvector",
    "alembic",
    "boto3",
    "structlog",
    "pypdf>=7.2.0",
    "langgraph>=1.2.24",
    "langchain-core>=1.8.5",
    "langchain-anthropic>=1.7.13",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "boto3-stubs[bedrock-agent-runtime,bedrock-runtime,secretsmanager]",
    "python-dotenv",
    "pre-commit",
    "fpdf2>=2.9.0",
    "cryptography>=50.0.2",
    "httpx2>=2.16.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs docker compose postgres"]
addopts = "-m 'not integration'"
pythonpath = ["."]
